services:
  pgvector:
    image: pgvector/pgvector:pg16   # 官方镜像，内置 vector 扩展
    container_name: vector-demo-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest     # 本地模型服务：bge-m3(embedding) + qwen3:4b(对话)
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # 模型文件存 E 盘，避免占 C 盘（对应 OLLAMA_MODELS）
      - E:/devtools/ollama/models:/root/.ollama

volumes:
  pgdata:
